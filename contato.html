<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato - Portal Escolar</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
    <div class="container">

        <a href="index.html" class="logo">
            🎓 Portal Escolar
        </a>

        <nav>
            <a href="index.html">Início</a>
            <a href="aluno.html">Aluno</a>
            <a href="professor.html">Professor</a>
            <a href="administrativo.html">Administrativo</a>
            <a href="contato.html">Contato</a>
        </nav>

        <a href="aluno.html" class="btn-login">
            Acessar Sistema
        </a>

    </div>
</header>

    <main class="container">
        <section class="page-title">
            <h2>Contato</h2>
            <p>Entre em contato com a secretaria da escola.</p>
        </section>

        <section class="formulario">
            <label for="nome">Nome</label>
            <input id="nome" type="text" placeholder="Digite seu nome">

            <label for="email">E-mail</label>
            <input id="email" type="email" placeholder="Digite seu e-mail">

            <label for="mensagem">Mensagem</label>
            <textarea id="mensagem" rows="6" placeholder="Digite sua mensagem"></textarea>

            <button type="button">Enviar mensagem</button>
        </section>
    </main>

    <footer><p>&copy; 2026 Portal Escolar</p></footer>
</body>
</html>
