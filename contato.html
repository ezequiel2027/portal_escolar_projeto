<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato - Portal Escolar</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="container">
            <h1>Portal Escolar</h1>
            <nav>
                <a href="index.html">Início</a>
                <a href="aluno.html">Área do Aluno</a>
                <a href="professor.html">Área do Professor</a>
                <a href="administrativo.html">Área Administrativa</a>
                <a href="contato.html">Contato</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <section class="page-title">
            <h2>Contato</h2>
            <p>Entre em contato com a secretaria da escola.</p>
        </section>

        <section class="formulario">
            <label for="nome">Nome</label>
            <input id="nome" type="text" placeholder="Digite seu nome">

            <label for="email">E-mail</label>
            <input id="email" type="email" placeholder="Digite seu e-mail">

            <label for="mensagem">Mensagem</label>
            <textarea id="mensagem" rows="6" placeholder="Digite sua mensagem"></textarea>

            <button type="button">Enviar mensagem</button>
        </section>
    </main>

    <footer><p>&copy; 2026 Portal Escolar</p></footer>
</body>
</html>
